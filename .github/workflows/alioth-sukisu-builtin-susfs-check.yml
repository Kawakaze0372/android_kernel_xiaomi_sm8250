name: Check PixelOS alioth SukiSU builtin SUSFS port

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 2fbe35cee4e6dffb4f64dc4a08a7a70255fe333e
      - name: Verify PixelOS kernel source
        run: test "$(git rev-parse HEAD)" = 2fbe35cee4e6dffb4f64dc4a08a7a70255fe333e
      - name: Check pinned SukiSU builtin and SUSFS 4.19 patch
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/SukiSU-Ultra/SukiSU-Ultra.git "$RUNNER_TEMP/sukisu"
          git -C "$RUNNER_TEMP/sukisu" checkout b20dee702035af09cb2ecb5f35443bbc1747f3e6
          test "$(git -C "$RUNNER_TEMP/sukisu" rev-parse HEAD)" = b20dee702035af09cb2ecb5f35443bbc1747f3e6
          git clone --filter=blob:none https://gitlab.com/simonpunk/susfs4ksu.git "$RUNNER_TEMP/susfs"
          git -C "$RUNNER_TEMP/susfs" checkout 001e69919c6271f690fd00b17e4c721c9e599152
          test "$(git -C "$RUNNER_TEMP/susfs" rev-parse HEAD)" = 001e69919c6271f690fd00b17e4c721c9e599152
          cp "$RUNNER_TEMP/susfs/kernel_patches/fs/susfs.c" fs/
          cp "$RUNNER_TEMP/susfs/kernel_patches/include/linux/susfs.h" include/linux/
          cp "$RUNNER_TEMP/susfs/kernel_patches/include/linux/susfs_def.h" include/linux/
          patch --dry-run --batch -p1 -F3 < "$RUNNER_TEMP/susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
